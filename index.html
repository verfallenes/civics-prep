      { id: 117, cat: "Recent History", q: "Name one American Indian tribe in the United States.", a: ["Cherokee", "Navajo", "Sioux", "Chippewa", "Choctaw", "Pueblo", "Apache", "Iroquois", "Creek", "Blackfeet", "Seminole"] },
      { id: 118, cat: "Recent History", q: "Name one example of an American innovation.", a: ["Light bulb", "Automobile", "Cars", "Skyscrapers", "Airplane", "Assembly line", "Landing on the moon", "Integrated circuit"] },
      { id: 119, cat: "Symbols and Holidays", q: "What is the capital of the United States?", a: ["Washington, D.C.", "Washington D.C."] },
      { id: 120, cat: "Symbols and Holidays", q: "Where is the Statue of Liberty?", a: ["New York Harbor", "Liberty Island", "New York"] },
      { id: 121, cat: "Symbols and Holidays", q: "Why does the flag have 13 stripes?", a: ["Because there were 13 original colonies", "Represent original colonies"] },
      { id: 122, cat: "Symbols and Holidays", q: "Why does the flag have 50 stars?", a: ["One star for each state", "50 states"] },
      { id: 123, cat: "Symbols and Holidays", q: "What is the name of the national anthem?", a: ["The Star-Spangled Banner"] },
      { id: 124, cat: "Symbols and Holidays", q: "The Nation's first motto was 'E Pluribus Unum.' What does that mean?", a: ["Out of many, one", "We all become one"] },
      { id: 125, cat: "Symbols and Holidays", q: "What is Independence Day?", a: ["Holiday to celebrate independence from Britain", "Country's birthday"] },
      { id: 126, cat: "Symbols and Holidays", q: "Name three national U.S. holidays.", a: ["New Year's Day", "Martin Luther King, Jr. Day", "Presidents Day", "Memorial Day", "Juneteenth", "Independence Day", "Labor Day", "Columbus Day", "Veterans Day", "Thanksgiving", "Christmas"] },
      { id: 127, cat: "Symbols and Holidays", q: "What is Memorial Day?", a: ["Holiday to honor soldiers who died in military service"] },
      { id: 128, cat: "Symbols and Holidays", q: "What is Veterans Day?", a: ["Holiday to honor people in the U.S. military", "Honor veterans"] }
    ];

    // 2. STATE MANAGEMENT & FUZZY COMPARATOR
    let examDeck = [];
    let currentIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let recognition = null;
    let isListening = false;

    // Levenshtein similarity metric
    function similarity(s1, s2) {
      let longer = s1.toLowerCase().trim();
      let shorter = s2.toLowerCase().trim();
      if (longer.length < shorter.length) {
        let temp = longer;
        longer = shorter;
        shorter = temp;
      }
      let longerLength = longer.length;
      if (longerLength === 0) return 1.0;
      
      const costs = [];
      for (let i = 0; i <= longer.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= shorter.length; j++) {
          if (i === 0) costs[j] = j;
          else {
            if (j > 0) {
              let newValue = costs[j - 1];
              if (longer.charAt(i - 1) !== shorter.charAt(j - 1))
                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
              costs[j - 1] = lastValue;
              lastValue = newValue;
            }
          }
        }
        if (i > 0) costs[shorter.length] = lastValue;
      }
      return (longerLength - costs[shorter.length]) / parseFloat(longerLength);
    }

    function cleanString(str) {
      return str.toLowerCase()
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
        .replace(/\b(the|a|an|is|it|to|of|in|for|and|that|by)\b/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function checkAnswerFuzzy(spokenText, acceptedAnswers) {
      const cleanSpoken = cleanString(spokenText);
      if (!cleanSpoken) return false;

      for (const ans of acceptedAnswers) {
        const cleanTarget = cleanString(ans);
        // Direct containment check (e.g. "it is Hakeem Jeffries" contains "hakeem jeffries")
        if (cleanSpoken.includes(cleanTarget) || cleanTarget.includes(cleanSpoken)) {
          return true;
        }
        // Character similarity threshold of 75%
        if (similarity(cleanSpoken, cleanTarget) >= 0.75) {
          return true;
        }
        // Multi-word keyword subset matching
        const targetWords = cleanTarget.split(' ').filter(w => w.length > 2);
        if (targetWords.length > 0) {
          const matchedWords = targetWords.filter(w => cleanSpoken.includes(w));
          if (matchedWords.length / targetWords.length >= 0.65) {
            return true;
          }
        }
      }
      return false;
    }

    // 3. VOICE RECOGNITION SETUP
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('btn-mic').classList.add('hidden');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-status').innerText = "Listening...";
        document.getElementById('mic-icon').classList.add('pulse-mic');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        handleSpokenAnswer(transcript);
      };

      recognition.onerror = (e) => {
        console.warn("Speech recognition error:", e.error);
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    }

    function stopListening() {
      isListening = false;
      document.getElementById('mic-status').innerText = "Tap to Speak Answer";
      document.getElementById('mic-icon').classList.remove('pulse-mic');
    }

    function handleSpokenAnswer(transcript) {
      const heardBox = document.getElementById('heard-box');
      const heardText = document.getElementById('heard-text');
      const badge = document.getElementById('match-badge');

      heardBox.classList.remove('hidden');
      heardText.innerText = transcript;

      const currentQ = examDeck[currentIndex];
      const isMatch = checkAnswerFuzzy(transcript, currentQ.a);

      badge.classList.remove('hidden');
      if (isMatch) {
        badge.innerText = "Match Detected (Likely Correct)";
        badge.className = "text-xs px-2 py-1 rounded font-bold bg-emerald-950 text-emerald-400 border border-emerald-700";
      } else {
        badge.innerText = "No Confident Match";
        badge.className = "text-xs px-2 py-1 rounded font-bold bg-rose-950 text-rose-400 border border-rose-700";
      }

      // Automatically reveal answers for confirmation
      document.getElementById('answer-box').classList.remove('hidden');
      document.getElementById('controls-reveal').classList.add('hidden');
      document.getElementById('controls-grade').classList.remove('hidden');
    }

    // 4. EXAM LIFECYCLE
    function initExam() {
      examDeck = [...rawQuestions].sort(() => Math.random() - 0.5);
      currentIndex = 0;
      correctCount = 0;
      incorrectCount = 0;
      document.getElementById('view-result').classList.add('hidden');
      document.getElementById('view-exam').classList.remove('hidden');
      renderCurrentExamQuestion();
    }

    function renderCurrentExamQuestion() {
      const q = examDeck[currentIndex];
      document.getElementById('exam-qnum').innerText = `${currentIndex + 1} / 20`;
      document.getElementById('exam-correct').innerText = `${correctCount} / 12`;
      document.getElementById('exam-incorrect').innerText = `${incorrectCount} / 9`;
      document.getElementById('exam-category').innerText = q.cat;
      document.getElementById('exam-question').innerText = q.q;

      // Reset voice UI elements
      document.getElementById('heard-box').classList.add('hidden');
      document.getElementById('match-badge').classList.add('hidden');
      document.getElementById('heard-text').innerText = '';

      const ansList = document.getElementById('exam-answers');
      ansList.innerHTML = '';
      q.a.forEach(ans => {
        const li = document.createElement('li');
        li.innerText = ans;
        ansList.appendChild(li);
      });

      document.getElementById('answer-box').classList.add('hidden');
      document.getElementById('controls-reveal').classList.remove('hidden');
      document.getElementById('controls-grade').classList.add('hidden');

      speak(q.q);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    // 5. EVENT LISTENERS
    document.getElementById('btn-mic').addEventListener('click', () => {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    document.getElementById('btn-speak').addEventListener('click', () => {
      speak(examDeck[currentIndex].q);
    });

    document.getElementById('btn-reveal').addEventListener('click', () => {
      document.getElementById('answer-box').classList.remove('hidden');
      document.getElementById('controls-reveal').classList.add('hidden');
      document.getElementById('controls-grade').classList.remove('hidden');
    });

    document.getElementById('btn-correct').addEventListener('click', () => {
      correctCount++;
      evaluateNextStep();
    });

    document.getElementById('btn-incorrect').addEventListener('click', () => {
      incorrectCount++;
      evaluateNextStep();
    });

    function evaluateNextStep() {
      if (correctCount >= 12) {
        finishExam(true, `Passed! Reached 12 correct answers in ${currentIndex + 1} questions.`);
        return;
      }
      if (incorrectCount >= 9) {
        finishExam(false, `Failed. Reached 9 incorrect answers.`);
        return;
      }
      if (currentIndex + 1 >= 20) {
        finishExam(correctCount >= 12, `Completed 20 questions. Score: ${correctCount} correct.`);
        return;
      }
      currentIndex++;
      renderCurrentExamQuestion();
    }

    function finishExam(passed, message) {
      document.getElementById('view-exam').classList.add('hidden');
      const resView = document.getElementById('view-result');
      resView.classList.remove('hidden');
      const title = document.getElementById('result-title');
      title.innerText = passed ? "TEST PASSED! 🇺🇸" : "TEST NOT PASSED";
      title.className = `text-3xl font-extrabold mb-2 ${passed ? 'text-emerald-400' : 'text-rose-400'}`;
      document.getElementById('result-desc').innerText = message;
    }

    document.getElementById('btn-restart').addEventListener('click', initExam);

    // Tab Navigation
    document.getElementById('tab-exam').addEventListener('click', () => {
      document.getElementById('view-exam').classList.remove('hidden');
      document.getElementById('view-study').classList.add('hidden');
      document.getElementById('tab-exam').className = "px-3 py-1 bg-blue-700 font-semibold rounded text-sm text-white";
      document.getElementById('tab-study').className = "px-3 py-1 bg-slate-800 text-slate-300 rounded text-sm";
    });

    document.getElementById('tab-study').addEventListener('click', () => {
      document.getElementById('view-exam').classList.add('hidden');
      document.getElementById('view-result').classList.add('hidden');
      document.getElementById('view-study').classList.remove('hidden');
      document.getElementById('tab-study').className = "px-3 py-1 bg-blue-700 font-semibold rounded text-sm text-white";
      document.getElementById('tab-exam').className = "px-3 py-1 bg-slate-800 text-slate-300 rounded text-sm";
      renderStudyList(rawQuestions);
    });

    function renderStudyList(list) {
      const c = document.getElementById('study-container');
      c.innerHTML = '';
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm";
        div.innerHTML = `
          <div class="text-xs text-blue-400 font-bold mb-1">Q${item.id}. ${item.cat}</div>
          <div class="font-medium text-white mb-2">${item.q}</div>
          <div class="text-emerald-300 text-xs">${item.a.join(' • ')}</div>
        `;
        c.appendChild(div);
      });
    }

    document.getElementById('search-study').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const filtered = rawQuestions.filter(q => 
        q.q.toLowerCase().includes(val) || 
        q.a.some(ans => ans.toLowerCase().includes(val))
      );
      renderStudyList(filtered);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    setupSpeechRecognition();
    initExam();
  </script>
